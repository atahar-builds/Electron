<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
  <title>Desktop Pet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <!-- Bubble is unused in Phase 1; Phase 4 fills it with canned lines. -->
    <div id="bubble" class="hidden"></div>

    <div id="pet" class="state-idle">
      <svg id="pet-svg" viewBox="0 0 120 120" width="140" height="140" aria-hidden="true">
        <!-- ground shadow -->
        <ellipse id="shadow" cx="60" cy="106" rx="26" ry="5" />

        <g id="body-group">
          <!-- antenna -->
          <g id="antenna">
            <line x1="60" y1="30" x2="60" y2="16" />
            <circle id="antenna-tip" cx="60" cy="13" r="4.5" />
          </g>

          <!-- body -->
          <rect id="body" x="24" y="28" width="72" height="72" rx="26" />
          <rect id="visor" x="33" y="42" width="54" height="36" rx="17" />

          <!-- eyes: #gaze is translated toward the cursor -->
          <g id="gaze">
            <g class="eye" id="eye-left">
              <ellipse class="eye-ball" cx="49" cy="60" rx="6.5" ry="7.5" />
              <ellipse class="eye-shine" cx="51" cy="57.5" rx="2" ry="2.2" />
            </g>
            <g class="eye" id="eye-right">
              <ellipse class="eye-ball" cx="71" cy="60" rx="6.5" ry="7.5" />
              <ellipse class="eye-shine" cx="73" cy="57.5" rx="2" ry="2.2" />
            </g>
            <!-- closed-eye lines, shown when blinking or asleep -->
            <path class="eye-closed" d="M42.5 60 q6.5 5 13 0" />
            <path class="eye-closed" d="M64.5 60 q6.5 5 13 0" />
          </g>

          <!-- little feet, they shuffle while walking -->
          <ellipse class="foot" id="foot-left" cx="46" cy="100" rx="9" ry="5" />
          <ellipse class="foot" id="foot-right" cx="74" cy="100" rx="9" ry="5" />
        </g>

        <!-- status glyph: ? when confused, ! when poked, z when asleep -->
        <text id="glyph" x="96" y="34">?</text>
      </svg>
    </div>

    <div id="debug" class="hidden"></div>
  </div>

  <script src="animator.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
